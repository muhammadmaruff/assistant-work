name: Firecrawl Scrape

on:
  workflow_dispatch:
    inputs:
      media:
        description: "Satu media saja, mis. impas.id (kosong = semua)"
        required: false
      dry_run:
        description: "Tes saja: hitung kandidat, tanpa scrape artikel"
        type: boolean
        default: false
  schedule:
    - cron: "0 22 * * *" # 05:00 WIB

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          ONLY_MEDIA: ${{ inputs.media }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/scrape.py
      - name: Simpan seen + fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore: scrape $(date -u +%F)" && git push)
